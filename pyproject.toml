[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "najdikit"
version = "2.0.0"
description = "Microsecond Real-Time Voice Call Engine, Gulf/Najdi Morphology, Multi-Backend TTS G2P/Tashkeel, STT Post-Processing, Modular Dialect Packs, and Alignment Scorer for Modern White Saudi Arabic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "NajdiKit Contributors" }
]
keywords = [
    "arabic",
    "saudi",
    "najdi",
    "white-dialect",
    "nlp",
    "tts",
    "stt",
    "g2p",
    "tashkeel",
    "phonetics",
    "whisper",
    "mcp",
    "llm-grounding",
    "voice-calls",
    "telephony",
    "habibi-tts",
    "elevenlabs",
    "morphology"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech"
]
dependencies = []

[project.optional-dependencies]
mlx = [
    "mlx>=0.18.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.18.0; platform_system == 'Darwin' and platform_machine == 'arm64'"
]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
najdikit = "najdikit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
najdikit = ["data/*.json", "data/packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
